<div class="question-answer">
    <div class="question">
        请帮我声明两个变量（机器人、机器人），并将它们的值分别设置为整数（2、5）。
    </div>
    <div class="answer">
        <pre class="brush: python">
robots = 2
droids = 5
        </pre>
    </div>
</div>
<div class="question-answer">
    <div class="question">
        如何在一行中为变量设置值（第一个变量获得第一个值等）？
    </div>
    <div class="answer">
        <pre class="brush: python">
robots, droids = 2, 5
        </pre>
    </div>
</div>
<div class="question-answer">
    <div class="question">
        给我看带有类型注释的变量声明。
    </div>
    <div class="answer">
        <pre class="brush: python">
robots: int = 2
droids: int = 5
        </pre>
    </div>
</div>
<div class="question-answer">
    <div class="question">
        谢谢！我现在知道并理解得更多了！一切正常！
    </div>
    <div class="answer">
        很高兴听到这个消息 👍！
    </div>
</div>
